[package]
name = "anchor-spl"
version.workspace = true
edition = "2021"
repository = "https://github.com/otter-sec/anchor"
description = "Anchor v2 SPL account types and constraint markers"
license = "Apache-2.0"

[features]
default = ["guardrails"]
# Security-sensitive: disabling this removes defensive program-id checks from
# CPI helpers that accept caller-supplied program accounts. Keep enabled unless
# every caller uses typed `Program` / `Interface` accounts or performs equivalent
# validation before constructing CPI contexts.
guardrails = []
metadata = ["dep:mpl-token-metadata"]

[dependencies]
anchor-lang = { workspace = true }
pinocchio = { workspace = true }
pinocchio-token = "0.6"
pinocchio-token-2022 = "0.3"
bytemuck = { version = "1", features = ["derive"] }
solana-address = { workspace = true, features = ["bytemuck"] }
solana-program-error.workspace = true

[dev-dependencies]
anchor-lang = { workspace = true, features = ["testing"] }
borsh = "1.6.1"
# Cross-checks `Mint` / `TokenAccount` layout against the canonical
# `spl-token-interface` types (see `tests/miri_spl_pod.rs`). Dev-only.
solana-program-pack.workspace = true
spl-token-interface = "2.0"
spl-token-2022-interface = "2.1"

[target.'cfg(not(target_os = "solana"))'.dependencies]
borsh = "1.6.1"
solana-instruction = { workspace = true, default-features = true }
solana-pubkey.workspace = true
mpl-token-metadata = { version = "=5.1.2-alpha.2", optional = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(kani)']
